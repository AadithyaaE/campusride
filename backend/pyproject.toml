[project]
name = "campusride-backend"
version = "0.1.0"
description = "CampusRide — intelligent college bus commute assistant (backend)"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "motor>=3.5,<4",
  "pyyaml>=6.0",
  "tzdata>=2024.1", # IANA zones for zoneinfo on Windows (Asia/Kolkata)
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not integration'"
markers = [
  "integration: needs MongoDB (docker compose -f infra/docker-compose.yml up -d); run with -m integration",
]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = [
  "RUF001", "RUF002", "RUF003", # en-dashes / × in docstrings are intentional
  "B905", "RUF007", # zip(a, a[1:]) pairwise idiom is intentionally unequal-length
]
